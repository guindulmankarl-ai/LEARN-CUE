<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c5ce7">
  <title>LearnCue | Little Readers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="LearnCue home"><span class="brand-icon">📚</span><span>LearnCue</span></a>
    <div class="streak"><span>⭐</span> <strong id="starCount">0</strong> stars</div>
  </header>
  <main class="container">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">HELLO, LITTLE READER!</p>
        <h1>Let’s learn to<br><span>read together.</span></h1>
        <p class="hero-description">Letters, sounds, and little stories make big adventures.</p>
        <button class="primary-button" id="startButton">Start learning <span>→</span></button>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="sun">☀️</div><div class="book-stack">📚</div><div class="bear">🐻</div>
        <div class="floating-letter letter-a">A</div><div class="floating-letter letter-b">B</div>
      </div>
    </section>
    <section class="section-heading">
      <div><p class="eyebrow">YOUR ADVENTURE</p><h2>Choose an activity</h2></div>
      <p class="small-note">Learn a little every day 🌱</p>
    </section>
    <section class="activity-grid">
      <button class="activity-card card-peach" data-view="letters"><span class="activity-emoji">🔤</span><span class="activity-title">Letter Land</span><span class="activity-description">Learn letters and sounds</span><span class="card-arrow">→</span></button>
      <button class="activity-card card-blue" data-view="words"><span class="activity-emoji">📖</span><span class="activity-title">Little Words</span><span class="activity-description">Practice simple words</span><span class="card-arrow">→</span></button>
      <button class="activity-card card-purple" data-view="match"><span class="activity-emoji">🧩</span><span class="activity-title">Picture Match</span><span class="activity-description">Match words and pictures</span><span class="card-arrow">→</span></button>
      <button class="activity-card card-pink" data-view="listen"><span class="activity-emoji">🔊</span><span class="activity-title">Listen & Say</span><span class="activity-description">Hear words read aloud</span><span class="card-arrow">→</span></button>
      <button class="activity-card card-green" data-view="comprehension"><span class="activity-emoji">🌳</span><span class="activity-title">Story Time</span><span class="activity-description">Read and answer questions</span><span class="card-arrow">→</span></button>
      <button class="activity-card card-yellow" data-view="progress"><span class="activity-emoji">🏆</span><span class="activity-title">My Progress</span><span class="activity-description">See your stars and activities</span><span class="card-arrow">→</span></button>
    </section>
    <section id="activityPanel" class="panel hidden" aria-live="polite">
      <div class="panel-heading"><div><p class="eyebrow" id="panelEyebrow">LET'S PRACTICE</p><h2 id="panelTitle">Activity</h2></div><button id="closePanel" class="close-button" aria-label="Close activity">✕</button></div>
      <div id="panelContent"></div>
    </section>
    <footer><span>🌈</span> Every reader grows one page at a time. <span>🌈</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
